<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f2ea" />
  <title>Darts Checkout - .4nk</title>
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://darts.4nk.dev">
  <meta property="og:title" content="Darts Checkout - .4nk">
  <meta property="og:description" content="Ankoromoti Official Site - .4nk">
  <meta property="og:image" content="https://ankoromoti.com/assets/img/og-image.jpg">
  <meta property="og:site_name" content="Darts Checkout - .4nk">
  <meta property="og:locale" content="ja_JP">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://darts.4nk.dev">
  <meta property="twitter:title" content="Darts Checkout - .4nk">
  <meta property="twitter:description" content="Ankoromoti Official Site - .4nk">
  <meta property="twitter:image" content="https://ankoromoti.com/assets/img/og-image.jpg">
  <meta property="twitter:site" content="@Ankoromoti_00">
  <meta property="twitter:creator" content="@Ankoromoti_00">
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <main class="app" aria-label="ダーツチェックアウト練習">
    <header class="topbar">
      <button id="menuButton" class="icon-button" type="button" aria-label="メニューを開く">☰</button>
      <h1>Soft Checkout</h1>
      <div class="topbar-spacer" aria-hidden="true"></div>
    </header>

    <nav id="menu" class="menu" aria-label="メニュー" hidden>
      <button type="button" data-dialog="about">このアプリについて</button>
      <button type="button" data-dialog="arrange">ダーツのアレンジ表</button>
      <button type="button" data-dialog="difficulty">難易度を選択</button>
      <button type="button" data-dialog="stats">成績を見る</button>
      <button type="button" data-dialog="privacy">プライバシー</button>
      <button type="button" data-dialog="licenses">ライセンス</button>
      <a href="mailto:contact@ankoromoti.com?subject=Darts%20Checkout%20Feedback">メールで問い合わせ</a>
    </nav>

    <section class="score-panel" aria-label="問題">
      <div id="target" class="target">--</div>
      <div id="remaining" class="remaining">残り --</div>
      <div id="difficultyLabel" class="difficulty-label">全範囲</div>

      <div class="throws" aria-label="入力したダーツ">
        <div id="throw0" class="throw-slot">-</div>
        <div id="throw1" class="throw-slot">-</div>
        <div id="throw2" class="throw-slot">-</div>
      </div>

      <div id="message" class="message" aria-live="polite"></div>

      <div class="actions">
        <button id="undoButton" type="button" class="secondary">戻す</button>
        <button id="clearButton" type="button" class="secondary">クリア</button>
        <button id="answerButton" type="button" class="secondary">答え</button>
      </div>
      <button id="nextButton" type="button" class="primary">次へ</button>
    </section>

    <section class="board-panel" aria-label="ダーツ盤">
      <canvas id="dartboard" width="900" height="900"></canvas>
    </section>
  </main>

  <dialog id="dialog">
    <div class="dialog-header">
      <h2 id="dialogTitle"></h2>
      <button id="closeDialogButton" class="icon-button" type="button" aria-label="閉じる">×</button>
    </div>
    <div id="dialogContent" class="dialog-content"></div>
  </dialog>

  <script src="./script.js"></script>
</body>

</html>
